plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    mavenCentral()
    maven {
        name 'NeoForge'
        url 'https://maven.neoforged.net/releases'
    }
    maven { // Mantle
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven { // TOP / yarn2mcp
        name 'tterrag maven'
        url "https://maven.tterrag.com/"
    }
    maven { // CraftTweaker, Immersive Engineering, JEI
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven { // JSON Things
        name 'Dogforce Games'
        url 'https://www.dogforce-games.com/maven/'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersRevived'
}

// MC 26.1.2 ships as Java 25 bytecode, so the toolchain must be JDK 25. ModDevGradle uses a standard
// JavaCompile task, which (with the forked-compiler --add-opens below) lets lombok run under JDK 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

lombok {
    version = '1.18.46'
}

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${system.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

sourceSets {
    main {
        java {
            // Data providers are excluded from the port compile until the datagen run is re-enabled on 26.1.x.
            exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
            exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
            exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
            exclude 'slimeknights/tconstruct/common/data/**'
            exclude 'slimeknights/tconstruct/fluids/data/**'
            exclude 'slimeknights/tconstruct/gadgets/data/**'
            exclude 'slimeknights/tconstruct/library/data/**'
            exclude 'slimeknights/tconstruct/shared/data/**'
            exclude 'slimeknights/tconstruct/world/data/**'
            exclude 'slimeknights/tconstruct/smeltery/data/Byproduct.java'
            exclude 'slimeknights/tconstruct/smeltery/data/FluidContainerTransferProvider.java'
            exclude 'slimeknights/tconstruct/smeltery/data/SmelteryRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tables/data/**'
            exclude 'slimeknights/tconstruct/tools/data/ArmorModelProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/EnchantmentToModifierProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/FluidEffectProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ModifierProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ModifierRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/StationSlotLayoutProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolDefinitionDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolItemModelProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolsRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/client/**'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialRenderInfoProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialStatsDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialTraitsDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/TrimMaterialProvider.java'
            // datagen sprite/texture generators excluded pending ExistingFileHelper migration on 26.1 (re-add when re-enabling datagen)
            exclude 'slimeknights/tconstruct/library/client/data/GenericTextureGenerator.java'
            exclude 'slimeknights/tconstruct/library/client/data/material/AbstractMaterialRenderInfoProvider.java'
            exclude 'slimeknights/tconstruct/library/client/data/material/MaterialPaletteDebugGenerator.java'
            exclude 'slimeknights/tconstruct/library/client/data/material/TrimMaterialPaletteGenerator.java'
            exclude 'slimeknights/tconstruct/library/client/data/util/DataGenSpriteReader.java'
            exclude 'slimeknights/tconstruct/tools/data/sprite/TinkerTrimMaterialPaletteGenerator.java'
        }
        resources {
            srcDirs "src/generated/resources"
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
            // exclude debug resources, they are for helping us make the mod, not for the actual mod
            exclude 'assets/tconstruct/debug'
            // NeoForge 1.21+ uses singular data pack directories. Keep the old 1.20-style paths out.
            exclude 'data/**/recipes/**'
            exclude 'data/**/advancements/**'
            exclude 'data/**/loot_tables/**'
            exclude 'data/**/tags/blocks/**'
            exclude 'data/**/tags/entity_types/**'
            exclude 'data/**/tags/fluids/**'
            exclude 'data/**/tags/items/**'
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = "${neo_version}"
    // AccessTransformer at src/main/resources/META-INF/accesstransformer.cfg is auto-detected by MDG.

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // NeoForge 26.1.x split datagen into clientData/serverData; re-add once compiling.
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // NeoForge/Minecraft is provided by the moddev plugin via neoForge.version above.

    // Mantle, built locally from Mantle-Revived Neo/26.1.2 and dropped into libs/
    implementation files("libs/MantleRevived-${mantle_version}.jar")

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neo_range': neo_range,
        'mantle_range': mantle_range,
        'mantle_version': mantle_version,
        'jei_range': jei_range,
        'json_things_range': json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'net/**'

    manifest {
        attributes([
                "Specification-Title"     : "Tinkers Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Cap error output: with ~9k errors early in the port, an unbounded -Xmaxerrs makes Gradle OOM
    // while serializing the diagnostics back from the forked compiler. Raise as the count drops.
    options.compilerArgs += ['-Xmaxerrs', '2000']
    // JDK 23+ won't run path-discovered processors without explicit processing enabled.
    options.compilerArgs += ['-proc:full']
}

// Lombok's annotation processor works on JDK 25 ONLY when the javac that runs it has the jdk.compiler
// module opened. Gradle does not propagate org.gradle.jvmargs --add-opens to the actual compiler, so
// fork the compiler for compileJava and pass the opens as JVM args.
afterEvaluate {
    tasks.named('compileJava').configure {
        options.fork = true
        options.forkOptions.memoryMaximumSize = '4g'
        options.forkOptions.jvmArgs = [
            '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        ]
    }
}

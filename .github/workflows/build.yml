name: Build and Release

on:
  push:
    branches:
      - "Neo/1.21.1"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Read Version
        id: gradle_props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MANTLE_VERSION=$(grep '^mantle_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "mantle_version=$MANTLE_VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download latest Mantle-Revived build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p libs mantle-dl
          # Grab the latest published Mantle-Revived release jars
          gh release download \
            --repo KingNadienDev/Mantle-Revived \
            --dir mantle-dl \
            --pattern 'MantleRevived-*.jar' \
            --clobber
          # Pick the main jar (exclude sources/javadoc/all classifiers)
          MANTLE_JAR=$(ls mantle-dl/MantleRevived-*.jar \
            | grep -v -- '-sources' \
            | grep -v -- '-javadoc' \
            | grep -v -- '-all' \
            | head -n1)
          if [ -z "$MANTLE_JAR" ]; then
            echo "::error::No Mantle jar found in the latest KingNadienDev/Mantle-Revived release"
            ls -la mantle-dl/ || true
            exit 1
          fi
          echo "Latest Mantle jar: $MANTLE_JAR"
          # Copy into the exact filename Tinkers' build.gradle expects
          cp "$MANTLE_JAR" "libs/MantleRevived-${{ steps.gradle_props.outputs.mantle_version }}.jar"
          echo "Placed as libs/MantleRevived-${{ steps.gradle_props.outputs.mantle_version }}.jar"
          ls -la libs/

      - name: Build
        run: ./gradlew build

      - name: Create Tag
        run: |
          git tag v${{ steps.gradle_props.outputs.release_version }}
          git push origin v${{ steps.gradle_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gradle_props.outputs.release_version }}
          name: TinkersRevived ${{ steps.gradle_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
